<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte - Mishwar</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="../index.html">
                <i class="bi bi-briefcase-fill me-2"></i>Mishwar
            </a>
        </div>
    </nav>

    <!-- Register Form -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="feature-icon mx-auto mb-3" style="width: 70px; height: 70px;">
                                <i class="bi bi-person-plus fs-1 text-primary"></i>
                            </div>
                            <h2 class="fw-bold mb-2">Créer un compte</h2>
                            <p class="text-muted mb-0">
                                Ou <a href="login.html" class="text-primary fw-semibold">connectez-vous à votre compte</a>
                            </p>
                        </div>

                        <!-- User Type Selection -->
                        <div class="btn-group w-100 mb-4" role="group">
                            <input type="radio" class="btn-check" name="userType" id="company" value="COMPANY" checked>
                            <label class="btn btn-outline-primary" for="company">Entreprise</label>
                            
                            <input type="radio" class="btn-check" name="userType" id="freelance" value="FREELANCE">
                            <label class="btn btn-outline-secondary" for="freelance">Talent créatif</label>
                        </div>

                        <form id="registerForm">
                            <div id="alertContainer"></div>

                            <div class="mb-3">
                                <label for="name" class="form-label">Nom <span id="nameLabel">ou nom de l'entreprise</span></label>
                                <input type="text" class="form-control" id="name" required>
                            </div>

                            <div class="mb-3" id="companyNameField" style="display: none;">
                                <label for="companyName" class="form-label">Nom de l'entreprise</label>
                                <input type="text" class="form-control" id="companyName">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">Téléphone</label>
                                <input type="tel" class="form-control" id="phone">
                            </div>

                            <div class="mb-3">
                                <label for="location" class="form-label">Localisation</label>
                                <input type="text" class="form-control" id="location">
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Mot de passe</label>
                                <input type="password" class="form-control" id="password" required minlength="6">
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
                                <input type="password" class="form-control" id="confirmPassword" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 btn-lg">
                                Créer le compte
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/register.js"></script>
</body>
</html>
